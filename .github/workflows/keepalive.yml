name: 잠들지 않게 (한 달에 두 번)

# GitHub은 60일 동안 아무 변화가 없는 공개 저장소의 자동 실행을 멈춰요.
# 그래서 한 달에 두 번 작은 기록을 남겨서 계속 깨어 있게 해요.
on:
  schedule:
    - cron: "17 1 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          date -u +"%Y-%m-%d %H:%M UTC" > .keepalive
          git config user.name "camp-bot"
          git config user.email "camp-bot@users.noreply.github.com"
          git add .keepalive
          git commit -m "깨어 있기" && git push || true
